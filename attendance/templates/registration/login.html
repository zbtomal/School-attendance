<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Attendance Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Noto+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#F7F4EC',
                        forest: '#1E3D32',
                        'forest-deep': '#14291F',
                        gold: '#C9982E',
                        ink: '#2B3A67',
                        'ink-soft': '#6B7594',
                    },
                    fontFamily: {
                        display: ['"Special Elite"', 'monospace'],
                        sans: ['"Noto Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans', sans-serif;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.45rem 0.9rem;
            border-radius: 0.6rem;
            font-size: 0.8125rem;
            font-weight: 600;
            background: #1E3D32;
            border: 1px solid #1E3D32;
            color: #fff;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .back-btn:hover {
            background: #14291F;
            border-color: #14291F;
        }
    </style>
</head>

<body class="bg-paper min-h-screen flex items-center justify-center px-4 py-8 sm:py-10 font-sans text-ink">

    <div class="w-full max-w-md">

        <div class="text-center mb-8">
            <div class="font-display text-[11px] tracking-widest uppercase text-gold mb-3">Attendance Register</div>
            <h1 class="font-display text-[26px] sm:text-[32px] leading-snug text-forest-deep px-2">
                Shaheed Nur Hossain Memorial School
            </h1>
            <!-- <p class="text-sm text-ink-soft mt-4">Welcome! Choose how you'd like to log in.</p> -->
        </div>

        <div id="roleSelect" class="space-y-4">
            <button type="button" onclick="showLogin('teacher')"
                class="w-full min-h-[84px] bg-white border-2 border-forest/20 rounded-2xl p-5 text-left shadow-sm hover:shadow-md hover:border-forest active:scale-[0.99] transition flex items-center gap-4 touch-manipulation">
                <div
                    class="w-12 h-12 rounded-full bg-forest/10 flex items-center justify-center text-forest font-bold text-lg flex-shrink-0">
                    T
                </div>
                <div class="min-w-0">
                    <div class="font-bold text-forest-deep text-lg">Login as Teacher</div>
                    <div class="text-sm text-ink-soft mt-0.5">Take attendance for your assigned class</div>
                </div>
            </button>

            <button type="button" onclick="showLogin('admin')"
                class="w-full min-h-[84px] bg-white border border-gray-200 rounded-2xl p-5 text-left shadow-sm hover:shadow-md hover:border-forest active:scale-[0.99] transition flex items-center gap-4 touch-manipulation">
                <div
                    class="w-12 h-12 rounded-full bg-gold/20 flex items-center justify-center text-gold font-bold text-lg flex-shrink-0">
                    A
                </div>
                <div class="min-w-0">
                    <div class="font-bold text-forest-deep text-lg">Login as Admin</div>
                    <div class="text-sm text-ink-soft mt-0.5">Full access — students, teachers, reports</div>
                </div>
            </button>
        </div>

        <div id="loginForm" class="hidden">
            <div class="bg-white border border-gray-200 rounded-2xl p-5 sm:p-6 shadow-sm">
                <div class="flex items-center justify-between mb-5 gap-3">
                    <div>
                        <div class="font-display text-[11px] tracking-widest uppercase text-gold" id="roleLabel">Teacher
                            Login</div>
                        <h2 class="text-lg font-bold text-forest-deep mt-0.5">Enter your credentials</h2>
                    </div>
                    <button type="button" onclick="backToRole()" class="back-btn flex-shrink-0 min-h-[40px]">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                        Back
                    </button>
                </div>

                {% if form.errors %}
                <div class="bg-red-50 border border-red-200 text-red-700 rounded-xl p-3 mb-4 text-sm">
                    Invalid username or password. Please try again.
                </div>
                {% endif %}

                <form method="post" class="space-y-4">
                    {% csrf_token %}

                    <div>
                        <label class="block text-xs font-semibold text-ink-soft mb-1.5">Username</label>
                        <input type="text" name="username" required autofocus autocomplete="username"
                            class="w-full min-h-[48px] border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-forest focus:ring-2 focus:ring-forest/20"
                            placeholder="Enter username">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-ink-soft mb-1.5">Password</label>
                        <input type="password" name="password" required autocomplete="current-password"
                            class="w-full min-h-[48px] border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-forest focus:ring-2 focus:ring-forest/20"
                            placeholder="Enter password">
                    </div>

                    <button type="submit"
                        class="w-full min-h-[50px] bg-forest text-white font-bold py-3 rounded-xl hover:bg-forest-deep active:scale-[0.99] transition touch-manipulation">
                        Log In
                    </button>
                </form>
            </div>
        </div>

    </div>

    <script>
        function showLogin(role) {
            document.getElementById('roleSelect').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');

            const label = document.getElementById('roleLabel');
            if (role === 'teacher') {
                label.textContent = 'Teacher Login';
            } else {
                label.textContent = 'Admin Login';
            }
        }

        function backToRole() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('roleSelect').classList.remove('hidden');
        }
    </script>

</body>

</html>
